<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg">
<title>Deutsch Sprint</title>
<style>
:root{
  --bg:#FFF8EC; --card:#fff; --ink:#1F1B2E; --muted:#8A8499; --line:#EFE7D8;
  --brand:#FFB800; --brand2:#FF7A00; --ok:#22B573; --bad:#F0465A;
  --der:#3B82F6; --die:#F0465A; --das:#22B573;
  --r:22px; --shadow:0 6px 0 rgba(31,27,46,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
#app{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 2px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:15px}
h1{font-size:28px;margin:10px 0 2px;letter-spacing:-.02em}
.muted{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin:14px 0}
.hero{background:linear-gradient(135deg,#FFD24A,#FF9A3C);border:0;color:#2A1A00}
.hero .big{font-size:44px}
.btn{display:block;width:100%;padding:16px;border-radius:18px;font-weight:800;font-size:18px;background:var(--ink);color:#fff;box-shadow:0 5px 0 #000;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.btn.ok{background:var(--ok);box-shadow:0 5px 0 #168A56}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #B32638}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px}.row>*{flex:1}
/* path */
.path{position:relative;padding:8px 0 4px}
.node{display:flex;align-items:center;gap:14px;margin:10px 0}
.node:nth-child(4n+2){padding-left:44px}.node:nth-child(4n+3){padding-left:88px}.node:nth-child(4n+4){padding-left:44px}
.dot{width:62px;height:62px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:28px;background:#EDE6D8;box-shadow:0 5px 0 #D9CFBD}
.node.done .dot{background:var(--brand);box-shadow:0 5px 0 #C98F00}
.node.today .dot{background:var(--brand2);box-shadow:0 5px 0 #B85600;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.node b{display:block;font-size:16px}.node small{color:var(--muted);font-size:13px}
.stars{font-size:13px;letter-spacing:1px}
/* session */
.bar{height:14px;background:#EDE6D8;border-radius:99px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7BE0A8);border-radius:99px;transition:width .3s}
.x{background:none;font-size:24px;padding:4px 8px;color:var(--muted)}
.prompt{font-size:24px;font-weight:700;line-height:1.35;margin:8px 0 6px}
.blank{display:inline-block;min-width:56px;border-bottom:3px dashed var(--brand2);color:var(--brand2);text-align:center}
.hint{display:inline-block;background:#FFF1D1;color:#8A5A00;border-radius:10px;padding:3px 10px;font-weight:700;font-size:15px}
.label{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
input.answer{width:100%;font:inherit;font-size:22px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;margin:14px 0 8px;outline:none;background:#fff}
input.answer:focus{border-color:var(--brand2)}
.uml{display:flex;gap:8px;margin-bottom:14px}.uml button{flex:1;padding:10px 0;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:18px}
.opts{display:grid;gap:10px;margin:16px 0}
.opt{padding:16px;border-radius:16px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:18px;text-align:left}
.opt.sel{border-color:var(--der)}
.opt.right{background:#E3F8EE;border-color:var(--ok)}.opt.wrong{background:#FDE7EA;border-color:var(--bad)}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.art{padding:18px 0;border-radius:16px;font-weight:900;font-size:22px;color:#fff}
.art.der{background:var(--der);box-shadow:0 5px 0 #2563C9}.art.die{background:var(--die);box-shadow:0 5px 0 #B32638}.art.das{background:var(--das);box-shadow:0 5px 0 #168A56}
.word{font-size:34px;font-weight:900;margin:10px 0}
.tag-der{color:var(--der)}.tag-die{color:var(--die)}.tag-das{color:var(--das)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border-radius:16px;border:2px dashed var(--line);margin:12px 0}
.tiles.pool{border:0;padding:0}
.tile{padding:10px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:18px}
.tile.used{visibility:hidden}
.sheet{position:fixed;left:0;right:0;bottom:0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);border-radius:24px 24px 0 0;transform:translateY(110%);transition:transform .22s ease-out;z-index:5}
.sheet.show{transform:none}
.sheet.ok{background:#DDF6E8}.sheet.bad{background:#FDE1E5}
.sheet .inner{max-width:520px;margin:0 auto}
.sheet h3{margin:0 0 6px;font-size:22px}
.combo{font-weight:900;color:var(--brand2)}
pre.log{white-space:pre-wrap;background:#1F1B2E;color:#F6F1E7;border-radius:16px;padding:14px;font-size:14px}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats div{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 4px}
.stats b{display:block;font-size:24px}
a{color:var(--brand2)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet"><div class="inner"></div></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
